name: iOS build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - name: Use CocoaPods integration
        run: flutter config --no-enable-swift-package-manager
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
      - name: Verify native FFI symbols
        run: |
          executable="build/ios/iphoneos/Runner.app/Runner"
          for symbol in _create_coordinate _create_intersection _homography_warp; do
            nm -gU "$executable" | grep -q " $symbol$" || {
              echo "Missing native FFI symbol: $symbol"
              exit 1
            }
          done
      - name: Package Runner.app
        run: |
          cd build/ios/iphoneos
          zip -qry Runner.app.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: KeyDecoder-ios-unsigned
          path: build/ios/iphoneos/Runner.app.zip
